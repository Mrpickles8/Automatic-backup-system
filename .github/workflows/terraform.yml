
name: Terraform CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      action:
        description: "Operation to perform"
        required: true
        type: choice
        options:
          - deploy
          - destroy
        default: deploy

env:
  TF_VERSION: "1.16.5"
  AWS_REGION: "eu-west-1"

permissions:
  contents: read

jobs:
  terraform-security:
    name: Security & Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.0

      - name: Initialize TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint

      - name: Checkov security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: true

  terraform-validate:
    name: Validate, Cost & Plan
    runs-on: ubuntu-latest
    needs: terraform-security
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.action == 'deploy')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: >-
          github.event_name == 'pull_request' ||
          github.event_name == 'workflow_dispatch'
        env:
          TF_VAR_notification_email: ${{ secrets.NOTIFICATION_EMAIL }}
        run: terraform plan -no-color

      - name: Setup Infracost
        uses: infracost/actions/setup@v3

      - name: Infracost Cost Estimation
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          infracost breakdown \
            --path . \
            --format table \
            --out-file infracost.txt

          cat infracost.txt

  approval:
    name: Production Approval
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: >-
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.action == 'deploy')

    environment: production

    steps:
      - name: Approval confirmed
        run: echo "Production approval granted. Ready to deploy."

  terraform-deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: approval
    if: >-
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.action == 'deploy')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        env:
          TF_VAR_notification_email: ${{ secrets.NOTIFICATION_EMAIL }}
        run: terraform apply -auto-approve

  terraform-test-backup:
    name: Post-Deploy Tests
    runs-on: ubuntu-latest
    needs: terraform-deploy
    if: needs.terraform-deploy.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify S3 buckets
        shell: bash
        run: |
          set -euo pipefail

          for TYPE in documents database media logs; do
            mapfile -t BUCKETS < <(
              aws s3api list-buckets \
                --query "Buckets[?starts_with(Name, 'backup-system-${TYPE}')].Name" \
                --output text |
              tr '\t' '\n' |
              grep -E "^backup-system-${TYPE}(-|$)" || true
            )

            if [ "${#BUCKETS[@]}" -eq 0 ]; then
              echo "::error::Bucket for ${TYPE} not found"
              exit 1
            fi

            for BUCKET in "${BUCKETS[@]}"; do
              echo "Bucket ${TYPE} exists: ${BUCKET}"
            done
          done

      - name: Verify versioning enabled
        shell: bash
        run: |
          set -euo pipefail

          for TYPE in documents database media logs; do
            mapfile -t BUCKETS < <(
              aws s3api list-buckets \
                --query "Buckets[?starts_with(Name, 'backup-system-${TYPE}')].Name" \
                --output text |
              tr '\t' '\n' |
              grep -E "^backup-system-${TYPE}(-|$)" || true
            )

            if [ "${#BUCKETS[@]}" -eq 0 ]; then
              echo "::error::Bucket for ${TYPE} not found"
              exit 1
            fi

            for BUCKET in "${BUCKETS[@]}"; do
              STATUS=$(aws s3api get-bucket-versioning \
                --bucket "$BUCKET" \
                --query 'Status' \
                --output text)

              if [ "$STATUS" != "Enabled" ]; then
                echo "::error::Versioning not enabled on ${BUCKET}"
                exit 1
              fi

              echo "Versioning enabled on ${BUCKET}"
            done
          done

      - name: Test backup Lambda
        shell: bash
        run: |
          set -euo pipefail

          aws lambda invoke \
            --function-name backup-system-backup-processor \
            --region "$AWS_REGION" \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            response.json > invoke-metadata.json

          cat invoke-metadata.json
          cat response.json

          if jq -e '.FunctionError' invoke-metadata.json >/dev/null; then
            echo "::error::Backup Lambda execution failed"
            exit 1
          fi

          echo "Lambda invocation completed without a reported function error"

  terraform-destroy:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'destroy' &&
      github.ref == 'refs/heads/main'

    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy Plan
        env:
          TF_VAR_notification_email: ${{ secrets.NOTIFICATION_EMAIL }}
        run: terraform plan -destroy -out=destroy.tfplan

      - name: Terraform Destroy
        env:
          TF_VAR_notification_email: ${{ secrets.NOTIFICATION_EMAIL }}
        run: terraform apply -auto-approve destroy.tfplan