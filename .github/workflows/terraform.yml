name: Terraform CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      action:
        description: "Operation to perform"
        required: true
        type: choice
        options:
          - deploy
          - destroy
        default: deploy

env:
  TF_VERSION: "1.16.5"
  AWS_REGION: "eu-west-1"

permissions:
  contents: read

jobs:

  terraform-security:
    name: Security & Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.0

      - name: Initialize TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint

      - name: Checkov security scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          soft_fail: true

  terraform-validate:
    name: Validate, Cost & Plan
    runs-on: ubuntu-latest
    needs: terraform-security
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'deploy'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check 

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color

      - name: Setup Infracost
        uses: infracost/actions/setup@v3

      - name: Infracost Cost Estimation
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          infracost breakdown --path . \
            --format table \
            --out-file infracost.txt
          cat infracost.txt


  approval:
    name: Manual Approval
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push' 
    environment: production

    steps:
      - name: Approval confirmed
        run: echo "Production approval granted. Ready to deploy."


  terraform-deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: approval
    if:
      github.ref == 'refs/heads/main' && github.event_name == 'push' 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        env:
          TF_VAR_notification_email: ${{ secrets.NOTIFICATION_EMAIL }}
        run: terraform apply -auto-approve


  post-deploy-tests:
    name: Post-deployment Tests
    runs-on: ubuntu-latest
    needs: terraform-deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify CloudWatch Dashboard
        run: |
          aws cloudwatch get-dashboard \
            --dashboard-name cost-calculator-dashboard \
            --region us-east-1
          echo "CloudWatch Dashboard exists!"

      - name: Verify SNS Topic
        shell: bash
        run: |
          TOPIC=$(aws sns list-topics \
            --region us-east-1 \
            --query 'Topics[?contains(TopicArn, `cost-calculator`)].TopicArn | [0]' \
            --output text)

          if [ -z "$TOPIC" ] || [ "$TOPIC" = "None" ]; then
            echo "SNS Topic not found"
            exit 1
          fi

          echo "SNS Topic active: $TOPIC"

      - name: Test Lambda Function
        run: |
          aws lambda invoke \
            --function-name cost-calculator-weekly-report \
            --region eu-west-1 \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            response.json

          cat response.json

  
  terraform-destroy:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'destroy' &&
      github.ref == 'refs/heads/main'

    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        env:
          TF_VAR_notification_email: ${{ secrets.NOTIFICATION_EMAIL }}
        run: terraform destroy -auto-approve